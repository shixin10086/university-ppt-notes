name: validate

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate package and examples
        shell: pwsh
        run: ./scripts/check_package.ps1 -PythonExecutable python
